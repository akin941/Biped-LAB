# WP3-03: nightly PPO smoke training (gha-linux, CPU). Trains rsl-rl PPO on the
# WP3-02 velocity env for 60 iterations per seed and fails unless the mean reward
# of the last quarter of iterations beats the first quarter. It checks that env,
# adapter and PPO learn together; it does not judge walking quality. The per-commit
# ci workflow never trains (see ci.yml); this runs nightly, on demand, and on PRs
# that change the training path. One extra job trains seed 0 with domain
# randomization on (WP3-05 env part). The biped-ppo-smoke job does the same for our
# own biped_v1 (BipedVelocityEnv, G4.3 preparation), scores the exported policy
# with scripts/eval_biped.py, and runs it in the Rust runtime in the sim loop
# (WP4-10: ONNX -> runtime MLP parity, then 10 s through the safety supervisor).
name: nightly-train

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/train_ppo.py
      - src/bipedlab/rl/**
      - scripts/eval_biped.py
      - simulation/custom-biped/**
      - runtime/src/policy.rs
      - .github/workflows/nightly-train.yml

permissions:
  contents: read

concurrency:
  group: nightly-train-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  ppo-smoke:
    name: ppo-smoke (seed ${{ matrix.seed }}${{ matrix.dr && ', dr' || '' }})
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2]
        dr: [""]
        include:
          - seed: 0
            dr: --dr
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --extra policy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party
          key: upstream-${{ hashFiles('upstream.lock.toml') }}
      - run: uv run python scripts/fetch_upstream.py microduck_rl
      # Training stack pinned to upstream microduck_rl's uv.lock (ADR-0012); torch from
      # the official CPU index (no CUDA libraries). Not a project dependency yet.
      - name: Install training stack
        run: |
          uv pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.9.1+cpu torchvision==0.24.1+cpu
          uv pip install tensordict==0.10.0 rsl-rl-lib==5.0.1 onnxscript==0.5.7 gitpython==3.1.46
      - name: PPO smoke training (60 iterations, 64 envs, 2 env workers)
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|Thread" || true
          .venv/bin/python scripts/train_ppo.py --envs 64 --iters 60 --workers 2 \
            --seed ${{ matrix.seed }} ${{ matrix.dr }} --require-rise --out reports/wp3-03/seed${{ matrix.seed }}${{ matrix.dr }}.json \
            --run-dir runs/seed${{ matrix.seed }}${{ matrix.dr }} --save-every 30
      - name: Exported ONNX runs in the evaluation runner (contract + finite rollout)
        run: |
          .venv/bin/python scripts/eval_velocity_env.py runs/seed${{ matrix.seed }}${{ matrix.dr }}/policy.onnx \
            --envs 2 --seconds 2 --actuators mjcf --out reports/wp3-03/eval_seed${{ matrix.seed }}${{ matrix.dr }}.json > /dev/null
          cp runs/seed${{ matrix.seed }}${{ matrix.dr }}/run.json reports/wp3-03/run_seed${{ matrix.seed }}${{ matrix.dr }}.json
      - name: Exported ONNX runs in the official-policy runner (G3.5, gha-linux part)
        run: |
          .venv/bin/bipedlab eval-policy runs/seed${{ matrix.seed }}${{ matrix.dr }}/policy.onnx \
            --model microduck-walk --actuator bam --out reports/wp3-03/runner_seed${{ matrix.seed }}${{ matrix.dr }}.json > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ppo-smoke-seed${{ matrix.seed }}${{ matrix.dr }}
          path: reports/

  biped-ppo-smoke:
    name: biped-ppo-smoke (seed ${{ matrix.seed }}${{ matrix.dr && ', dr' || '' }})
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2]
        dr: [""]
        include:
          - seed: 0
            dr: --dr
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --extra policy
      - name: Install training stack
        run: |
          uv pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.9.1+cpu torchvision==0.24.1+cpu
          uv pip install tensordict==0.10.0 rsl-rl-lib==5.0.1 onnxscript==0.5.7 gitpython==3.1.46
      - name: PPO smoke training on biped_v1 (60 iterations, 64 envs, 2 env workers)
        run: |
          .venv/bin/python scripts/train_ppo.py --robot biped_v1 --envs 64 --iters 60 --workers 2 \
            --seed ${{ matrix.seed }} ${{ matrix.dr }} --require-rise --out reports/biped/seed${{ matrix.seed }}${{ matrix.dr }}.json \
            --run-dir runs/seed${{ matrix.seed }}${{ matrix.dr }} --save-every 30
      - name: Exported ONNX runs in the biped evaluation (39 -> 10 contract, finite rollout, robustness cases)
        run: |
          .venv/bin/python scripts/eval_biped.py runs/seed${{ matrix.seed }}${{ matrix.dr }}/policy.onnx \
            --envs 2 --seconds 5 --robustness --out reports/biped/eval_seed${{ matrix.seed }}${{ matrix.dr }}.json > /dev/null
          cp runs/seed${{ matrix.seed }}${{ matrix.dr }}/run.json reports/biped/run_seed${{ matrix.seed }}${{ matrix.dr }}.json
      - name: Trained policy runs in the Rust runtime (WP4-10; preinstalled Rust, no crates)
        env:
          RUN: runs/seed${{ matrix.seed }}${{ matrix.dr }}
          TAG: seed${{ matrix.seed }}${{ matrix.dr }}
        run: |
          (cd runtime && cargo build --locked --release)
          .venv/bin/python scripts/export_mlp.py "$RUN/policy.onnx" --out "$RUN/policy.bpml" \
            --rust-bin runtime/target/release/mlp-eval > "reports/biped/mlp_export_$TAG.json"
          .venv/bin/python scripts/runtime_sim.py --seconds 10 --require-clean-exit \
            --out "reports/biped/runtime_$TAG.json" -- --controller "policy:$RUN/policy.bpml" > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: biped-ppo-smoke-seed${{ matrix.seed }}${{ matrix.dr }}
          path: reports/
