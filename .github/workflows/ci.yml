# Tiered CI (docs/testing/TESTING_STRATEGY.md):
#   static  -> ruff + mypy                      (seconds)
#   unit    -> pytest, no upstream              (seconds)
#   smoke   -> pytest -m upstream, CPU MuJoCo on the pinned Microduck model
#   macos   -> same suite on GitHub-hosted macOS arm64. This is NOT the owner's
#              M5 MacBook; Mac verification is tracked in docs/handoffs/.
# Never runs RL training. Third-party actions are pinned by commit sha.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Unit tests
        run: uv run pytest -m "not upstream and not slow" --junitxml=reports/unit.xml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party
          key: upstream-${{ hashFiles('upstream.lock.toml') }}
      - name: Fetch pinned upstream sources
        run: uv run python scripts/fetch_upstream.py microduck_rl
      - name: Upstream CPU smoke tests
        run: uv run pytest -m "upstream and not slow" -rs --junitxml=reports/smoke.xml
      - name: Batch env scaling (WP3-06, evidence only)
        run: |
          label=${{ startsWith(matrix.os, 'macos') && 'gha-macos' || 'gha-linux' }}
          cores=$(uv run python -c "import os; print(os.cpu_count())")
          echo "cpu_count=$cores"
          if command -v lscpu >/dev/null; then lscpu | grep -E "^CPU\(s\)|Thread|Core|Model name"; \
          else sysctl hw.physicalcpu hw.logicalcpu machdep.cpu.brand_string; fi
          uv run bipedlab bench microduck --env-label "$label" --seconds 4 \
            --num-envs 128 --env-workers 0 1 2 "$cores"
      - name: Batch env speed A/B against main (evidence only)
        run: |
          git fetch --depth 1 origin main
          git show FETCH_HEAD:src/bipedlab/rl/batch_env.py > "$RUNNER_TEMP/old_batch_env.py"
          uv run python scripts/ab_batch_env.py "$RUNNER_TEMP/old_batch_env.py" --rounds 3
      - name: Environment record
        if: always()
        run: |
          uname -a
          uv run python -c "import platform, mujoco, numpy; print(platform.platform(), platform.machine(), 'mujoco', mujoco.__version__, 'numpy', numpy.__version__)"

  pretrained-policy:
    # Downloads the pinned official policies (sha256-verified) and records how
    # they behave in CPU MuJoCo. The report is evidence (gha-linux), not a Mac result.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party
            learning/policies/cache
          key: upstream-policies-v2-${{ hashFiles('upstream.lock.toml', 'learning/policies/*.lock.toml') }}
      - run: uv run python scripts/fetch_upstream.py microduck_rl
      - run: >-
          uv run python scripts/fetch_policies.py alpha_walking.onnx alpha_stand.onnx
          alpha_sitstand.onnx alpha_ground_pick.onnx ball_kick_left.onnx ball_kick_right.onnx
          roulade.onnx
      - name: Contract tests on real weights
        run: uv run pytest -m policy -rs
      - name: Behaviour report
        run: |
          mkdir -p reports/wp1-11 reports/wp1-12 reports/wp1-13
          uv run bipedlab eval-policy alpha_walking.onnx --actuator bam --scenarios sweep --repeats 2 --out reports/wp1-13/sweep_bam.json
          uv run bipedlab eval-policy alpha_walking.onnx --scenarios sweep --out reports/wp1-13/sweep_mjcf.json
          uv run bipedlab eval-policy alpha_walking.onnx --actuator bam --init straight --repeats 4 --out reports/wp1-13/straight_bam.json
          uv run bipedlab eval-policy alpha_walking.onnx --init straight --out reports/wp1-13/straight_mjcf.json
          uv run bipedlab eval-policy alpha_walking.onnx --actuator bam --init straight --bam-delay 4 --vel-lag 1 --repeats 4 --out reports/wp1-13/straight_bam_delay4_vellag1.json
          uv run bipedlab eval-policy alpha_stand.onnx --scenarios standing --out reports/wp1-12/stand_mjcf.json
          uv run bipedlab eval-policy alpha_stand.onnx --scenarios standing --actuator bam --repeats 4 --out reports/wp1-12/stand_bam.json
          uv run bipedlab eval-policy alpha_stand.onnx --scenarios standing --actuator bam --bam-kp 160 --repeats 4 --out reports/wp1-12/stand_bam_kp160.json
          uv run bipedlab eval-policy alpha_stand.onnx --scenarios standing --actuator bam --bam-delay 4 --vel-lag 1 --repeats 4 --out reports/wp1-12/stand_bam_delay4_vellag1.json
          uv run bipedlab eval-policy alpha_stand.onnx --scenarios standing --actuator bam --init settle --out reports/wp1-12/stand_bam_settle.json
          grep -m1 "model name" /proc/cpuinfo
          uv run bipedlab eval-policy alpha_walking.onnx --actuator bam --repeats 8 --out reports/wp1-11/baseline.json
          uv run bipedlab eval-policy alpha_walking.onnx --out reports/alpha_walking.json
          uv run bipedlab eval-policy alpha_walking.onnx --init settle --out reports/alpha_walking_settle.json
          uv run bipedlab eval-policy alpha_stand.onnx --out reports/alpha_stand.json
          uv run bipedlab eval-policy alpha_walking.onnx --post robotd-walking --out reports/alpha_walking_robotd.json
          uv run bipedlab eval-behaviours --out reports/behaviours.json
          uv run bipedlab eval-policy alpha_walking.onnx --actuator bam --out reports/alpha_walking_bam.json
          uv run bipedlab eval-policy alpha_stand.onnx --actuator bam --out reports/alpha_stand_bam.json
          uv run bipedlab eval-policy alpha_walking.onnx --actuator bam --model microduck-walk --out reports/alpha_walking_bam_walkscene.json
          uv run bipedlab eval-policy alpha_walking.onnx --model microduck-walk --out reports/alpha_walking_walkscene.json
          uv run bipedlab eval-behaviours --actuator bam --out reports/behaviours_bam.json
          uv run bipedlab record alpha_walking.onnx --twist 0.2 0 0 --seconds 10 --actuator bam --env-label gha-linux --html --out reports/telemetry/alpha_walking_fwd_bam
          uv run bipedlab record alpha_walking.onnx --twist 0.2 0 0 --seconds 10 --env-label gha-linux --html --out reports/telemetry/alpha_walking_fwd
          uv run bipedlab record alpha_walking.onnx --twist 0.2 0 0 --seconds 10 --post robotd-walking --env-label gha-linux --html --out reports/telemetry/alpha_walking_fwd_robotd
      - name: G3.1 alpha_walking inside the training env (WP3-02, evidence only)
        run: |
          mkdir -p reports/g3-1
          uv run python scripts/eval_velocity_env.py alpha_walking.onnx --envs 8 --out reports/g3-1/alpha_walking.json > /dev/null
          uv run python -c "import json; r = json.load(open('reports/g3-1/alpha_walking.json')); [print(c['policy'], c['actuator'], c['twist'][0], 'noise' if c['noise'] else 'clean', 'falls', c['falls'], 'vx', c['vx_mean'], 'r/step', round(c['reward_per_step'], 4)) for c in r['cases']]"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: policy-reports
          path: reports/
